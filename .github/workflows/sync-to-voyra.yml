name: Sync to Voyra

# 本仓库 push 后，把 AI 模型对比秀 代码自动同步进 Voyra 主仓库并触发部署
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout voyra-ai-compare
        uses: actions/checkout@v4

      - name: Checkout Voyra main repo
        uses: actions/checkout@v4
        with:
          repository: liixnglinb/Voyra
          token: ${{ secrets.VOYRA_SYNC_TOKEN }}
          path: voyra

      - name: Sync files
        run: |
          cp "src/pages/PelicanGallery.jsx" "voyra/src/pages/PelicanGallery.jsx"

      - name: Commit & push to Voyra
        run: |
          cd voyra
          git config user.name "voyra-ai-compare-sync[bot]"
          git config user.email "liixnglinb@users.noreply.github.com"
          git add src/pages/PelicanGallery.jsx
          if git diff --cached --quiet; then
            echo "无代码变更，跳过提交"
            exit 0
          fi
          git commit -m "chore(voyra-ai-compare): 自动同步自 voyra-ai-compare ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push

